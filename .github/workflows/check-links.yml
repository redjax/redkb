---
#####################################
# Check links on site using Lychee. #
#####################################

name: Check links

on:
  workflow_dispatch:
    inputs:
      run-offline:
        description: Check local links, generated routes, assets, and fragments
        required: true
        type: boolean
        default: true

      run-online:
        description: Check non-GitHub external HTTP(S) links
        required: true
        type: boolean
        default: false

      run-github:
        description: Check GitHub links only
        required: true
        type: boolean
        default: false

      site-url:
        description: Optional live site URL; defaults to https://DOMAIN_NAME
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate selected checks
    runs-on: ubuntu-latest

    outputs:
      site-host: ${{ steps.site.outputs.host }}

    steps:
      - name: Validate selected checks
        shell: bash
        env:
          RUN_OFFLINE: ${{ inputs.run-offline }}
          RUN_ONLINE: ${{ inputs.run-online }}
          RUN_GITHUB: ${{ inputs.run-github }}
        run: |
          set -euo pipefail

          if [[ \
            "${RUN_OFFLINE}" != "true" &&
            "${RUN_ONLINE}" != "true" &&
            "${RUN_GITHUB}" != "true"
          ]]; then
            echo "::error::Select at least one link-check mode."
            exit 1
          fi

      - name: Resolve live site URL
        id: site
        shell: bash
        env:
          INPUT_SITE_URL: ${{ inputs.site-url }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_SITE_URL}" ]]; then
            site_url="${INPUT_SITE_URL%/}"
          else
            if [[ -z "${DOMAIN_NAME}" ]]; then
              echo "::error::site-url was not supplied and repository Actions variable DOMAIN_NAME is not set."
              exit 1
            fi

            site_url="https://${DOMAIN_NAME%/}"
          fi

          if [[ ! "${site_url}" =~ ^https?:// ]]; then
            echo "::error::site-url must begin with http:// or https://"
            exit 1
          fi

          site_host="$(
            printf '%s\n' "${site_url}" |
              sed -E 's#^https?://([^/:?#]+).*#\1#'
          )"

          if [[ -z "${site_host}" ]]; then
            echo "::error::Unable to derive a hostname from site URL: ${site_url}"
            exit 1
          fi

          echo "url=${site_url}" >> "${GITHUB_OUTPUT}"
          echo "host=${site_host}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Link-check configuration"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Offline | \`${{ inputs.run-offline }}\` |"
            echo "| Online | \`${{ inputs.run-online }}\` |"
            echo "| GitHub | \`${{ inputs.run-github }}\` |"
            echo "| Site URL | \`${site_url}\` |"
            echo "| Derived host | \`${site_host}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  check-links:
    name: Build site and run selected checks
    needs: validate-inputs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # renovate: datasource=github-releases depName=gohugoio/hugo versioning=semver-coerced
          hugo-version: 0.166.0
          extended: true

      - name: Verify Hugo installation
        shell: bash
        run: |
          set -euo pipefail
          hugo version

      - name: Install Lychee
        shell: bash
        env:
          # renovate: datasource=github-releases depName=lycheeverse/lychee versioning=semver-coerced
          LYCHEE_VERSION: v0.24.2
        run: |
          set -euo pipefail

          architecture="$(uname -m)"

          case "${architecture}" in
          x86_64)
            target="x86_64-unknown-linux-musl"
            ;;
          aarch64|arm64)
            target="aarch64-unknown-linux-musl"
            ;;
          *)
            echo "::error::Unsupported architecture: ${architecture}"
            exit 1
            ;;
          esac

          release_tag="lychee-${LYCHEE_VERSION}"
          archive="lychee-${target}.tar.gz"
          url="https://github.com/lycheeverse/lychee/releases/download/${release_tag}/${archive}"
          temporary_directory="$(mktemp --directory)"
          install_directory="${HOME}/.local/bin"

          trap 'rm -rf "${temporary_directory}"' EXIT

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --output "${temporary_directory}/${archive}" \
            "${url}"

          tar \
            --extract \
            --gzip \
            --file "${temporary_directory}/${archive}" \
            --directory "${temporary_directory}"

          lychee_binary="$(find "${temporary_directory}" -type f -name lychee -print -quit)"

          if [[ -z "${lychee_binary}" ]]; then
            echo "::error::Lychee executable was not found in the release archive."
            exit 1
          fi

          mkdir --parents "${install_directory}"

          install \
            --mode 0755 \
            "${lychee_binary}" \
            "${install_directory}/lychee"

          echo "${install_directory}" >> "${GITHUB_PATH}"

          "${install_directory}/lychee" --version

      - name: Build Hugo site
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/hugo/build.sh

      - name: Check offline links
        if: ${{ inputs.run-offline }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/lychee/check-links.sh --offline

      - name: Check non-GitHub external links
        if: ${{ inputs.run-online }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/lychee/check-links.sh \
            --online \
            --site-host "${{ needs.validate-inputs.outputs.site-host }}"

      - name: Check GitHub links
        if: ${{ inputs.run-github }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/lychee/check-links.sh --github
